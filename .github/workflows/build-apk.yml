name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository'ni yuklab olish (Checkout)
      uses: actions/checkout@v4

    - name: Java JDK o'rnatish
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle uchun ruxsat berish
      run: chmod +x gradlew

    - name: Debug APK yaratish (Build)
      run: ./gradlew assembleDebug

    - name: APK faylni saqlab qo'yish (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
